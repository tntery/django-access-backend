{% extends "access/includes/base.html" %}

{% block title %}Login | Smart Access Control{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 460px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h1 class="h4 mb-3">Sign In</h1>
            <p class="text-muted mb-4">Use your account to access admin template views.</p>

            {% if form.errors %}
            <div class="alert alert-danger" role="alert">
                Invalid username or password.
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_username" class="form-label">Username</label>
                    <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" maxlength="150" class="form-control" required id="id_username">
                </div>
                <div class="mb-3">
                    <label for="id_password" class="form-label">Password</label>
                    <input type="password" name="password" autocomplete="current-password" class="form-control" required id="id_password">
                </div>
                <input type="hidden" name="next" value="{{ next }}">
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
